<nav class="smart-bottom-nav" aria-label="User Navigation">

            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <div class="bottom-nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>

            </svg>
        </div>
        <span class="bottom-nav-label">Shop</span>
    </a>

    <a href="/user/my-orders" class="bottom-nav-item {% if active_page == 'orders' %}active{% endif %}">
        <div class="bottom-nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>

            </svg>
        </div>
        <span class="bottom-nav-label">Orders</span>

    <a href="/user/cart" class="bottom-nav-item {% if active_page == 'cart' %}active{% endif %}">
        <div class="bottom-nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            {% set cart_count = session.get('cart')|length if session.get('cart') else 0 %}
            {% if cart_count > 0 %}
                <span class="bottom-cart-badge">{{ cart_count }}</span>
            {% endif %}
        </div>
        <span class="bottom-nav-label">Cart</span>
    </a>

    <a href="/user/profile" class="bottom-nav-item {% if active_page == 'profile' %}active{% endif %}">

                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
